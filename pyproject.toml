# 安装、运行环境与打包依赖的唯一配置。版本从 msgx.__version__ 读取。
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msgx"
dynamic = ["version"]
description = "QQ 群消息萃取服务：接收 → 落库 → 带配文图片解析 → 摘要"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# 保留当前运行环境的全部 21 个精确版本；升级时一起验证兼容性。
# RapidOCR 1.2.3 是已验证版本，不能因合并配置顺带升级 OCR 接口。
dependencies = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.3",
  "aiosignal==1.4.0",
  "attrs==26.1.0",
  "flatbuffers==25.12.19",
  "frozenlist==1.8.0",
  "idna==3.20",
  "multidict==6.9.0",
  "numpy==2.5.3",
  "onnxruntime==1.30.0",
  "opencv-python==5.0.0.93",
  "packaging==26.3",
  "pillow==12.3.0",
  "propcache==0.5.4",
  "protobuf==7.36.2",
  "pyclipper==1.4.0",
  "PyYAML==6.0.3",
  "rapidocr-onnxruntime==1.2.3",
  "shapely==2.1.2",
  "six==1.17.0",
  "yarl==1.25.1",
]

[project.optional-dependencies]
build = [
  "altgraph==0.17.5",
  "pefile==2024.8.26; sys_platform == 'win32'",
  "pyinstaller==6.22.3",
  "pyinstaller-hooks-contrib==2026.7",
  "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
  "setuptools==84.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "msgx.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

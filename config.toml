# 消息萃取服务配置
# 修改后重启服务生效。

[app]
db_path    = "data/msgx.db"
media_dir  = "data/media"
report_dir = "data/reports"
log_level  = "INFO"

[onebot]
# NapCat 以「反向 WebSocket」方式连入本服务。
# 注意路径必须是 /onebot/ws（ws_port 端口上）；/onebot 是 HTTP POST 上报路径，混淆会握手失败。
# NapCat 侧填：ws://127.0.0.1:6700/onebot/ws
host        = "127.0.0.1"
ws_port     = 6700
http_port   = 6701
access_token = ""          # 与 NapCat 侧 token 保持一致；留空表示不校验

[watch]
# 留空 = 监听机器人账号加入的全部群。填写群号则只处理所列群。
groups = []

# 群号 → 群名。OneBot 群消息事件不带群名，在这里补上便于阅读。
# 例：123456789 = "AI 底层原理交流"
[watch.names]

[llm]
enabled                 = true
base_url                = "https://api.deepseek.com"
model                   = "deepseek-flash"   # 文本模型
vision_model            = "deepseek-flash"   # 仅解析消息附带文字的图片，不发送能力探测请求
api_key_env             = "DEEPSEEK_API_KEY"
api_key                 = ""                 # 也可直接写在这里（不推荐，优先用环境变量）
max_daily_cost_cny      = 10.0
# ---- 计费口径：对齐 DeepSeek 开放平台账单 ----
# 官方对 deepseek-flash（V4.1-Flash）实行「峰谷 + 缓存命中」三档计价，
# 单位：元 / 百万 token，以下填的是**空闲时段**价。
# 来源：https://api-docs.deepseek.com/quick_start/pricing
price_cache_hit_cny_per_mtok  = 0.02   # 输入 · 缓存命中
price_cache_miss_cny_per_mtok = 1.00   # 输入 · 缓存未命中
price_output_cny_per_mtok     = 4.00   # 输出
peak_multiplier               = 2.0    # 高峰 = 空闲 × 2
# 高峰时段（UTC，仅周一至周五）= 北京时间工作日 09:00-12:00 与 14:00-18:00
peak_windows_utc              = "01:00-04:00,06:00-10:00"
timeout_seconds         = 90

# 连接层失败的重试次数（v0.5.1）。实测本机到 api.deepseek.com 会偶发
# ServerDisconnectedError —— 与请求体大小**无关**（13KB 与 126KB 的图都测过，
# 全部成功、中位 0.8s），属于链路中间的问题，只能靠重试扛。
# 重试**不会**重置共享会话：那会把并发的在途请求一起掐死（实测 4 并发全灭、
# 且挂到 60s 超时），一次抖动会被放大成一片失败。
post_retries            = 4

# 思考开启时的最小 max_tokens（v0.5.1）。思考 token 与正文**共用**这个额度，
# 给少了就会出现「思考吃光预算 → 正文为空」的静默空结果。
# 摘要和图片解析默认不启用思考，此项仅在显式启用思考时生效。
# max_tokens 是**上限不是预扣**：模型提前收尾就不产生费用，所以抬高近乎零成本。
think_min_tokens        = 1200

# 图片上传前的压缩（v0.5.0）。请求里带的是 detail="low"，服务端本来就会把图
# 大幅降采样（实测一张 2.8MB 的图进来只计 198 个 prompt token），客户端先缩到
# 长边 1280 / JPEG q85 可把上传量降到 1/30，图像内容与提取质量无可感知差异。
vision_max_side         = 1280
vision_jpeg_quality     = 85

[media]
ocr_enabled        = true
vision_enabled     = true     # 仅处理有消息配文的图片；不主动探测图片能力
max_download_mb    = 20
images_per_minute  = 60       # 图片处理限速，控制成本

[summary]
prompt              = ""      # 空 = 使用内置申论式纪要提示词，可在界面设置中编辑
target_chars        = 3000    # 由模型归纳控制篇幅，不截取生成结果

[napcat]
# 协议端（NapCat）的启动脚本。
#
# 本服务只做「监听协议端连入」，**不会**替你启动 NapCat —— 这是两件事。
# 填上下面这行，界面里就会出现「启动协议端(NapCat)」按钮，点一下即可拉起。
#
# 默认指向项目自带的 tools/start_napcat.bat：它会自动探测 NapCat 目录
# （也可用环境变量 NAPCAT_HOME 指定），先修正工作目录再提权 —— 直接调 NapCat 自带的
# launcher.bat 会因为工作目录变成 System32 而一闪而过。
# 相对路径以项目根为基准，所以整个项目搬到别的目录也不用改这里。
#
# 注意：会弹一次 UAC 授权窗口，必须点「是」。原因：NapCat 要向 QQ 进程注入 DLL，
# 这属于管理员操作，无法绕过。（NapCat 启动后 QQ 会一起起来，首次需扫码登录。）
#
# 留空 = 不显示该按钮，仍可手动启动。
start_script = "tools/start_napcat.bat"

# 「重启协议端」按钮执行的脚本（v0.5.4）。
#
# 为什么需要它：点「启动协议端」只是「再注入一份 + 再拉起一份 QQ」，**不会先清场**。
# 卡住的那份如果已经登不上（连着、能应答 API，却一条消息都不推），新的一份会和它并存，
# 两份各自往 cache\qrcode.png 写二维码互相覆盖 —— 扫哪一次都可能立刻失效。
# 所以「消息冻结」时正确的动作是「先全部退出、再重新登录」，这个按钮就是这个动作。
#
# 脚本自己会提权（提权失败会提示），界面直接调它，全程只弹一次 UAC。
# 相对路径以项目根为基准。留空 = 不显示该按钮。
restart_script = "tools/重启协议端.bat"

# ---- 主动看门狗（v0.5.4）----
# 协议端会「连着、能应答 API，却一条消息都不推」—— 这种状态下界面上的
# 「协议端已连接」依然是绿的，实测最长挂了 9 小时才被用户发现。
# 看门狗定期检查「桌面 QQ 的消息库是不是不写了」，命中只写入日志。
#
# 不弹窗、不自动重启；在运行状态和日志中查看故障。
# 判定要求同时满足四条：协议端连着 / QQ 消息库超过 stale_minutes 没写 /
# 本库同期也没新消息 / 这个小时按历史基线本该是活跃的。
# 最后一条是防误报的关键：没有它，凌晨一点准点报警（而深夜没人讲话是常态）。
[watchdog]
enabled            = true
check_seconds      = 300   # 检查间隔（秒）
stale_minutes      = 30    # QQ 消息库超过这么久没写入 ⇒ 可疑
busy_min_messages  = 5     # 该小时历史中位数低于它就认为「本来就没人说话」，不报
baseline_days      = 7     # 历史基线取最近几天

# NapCat 的安装目录。填了它，界面才会自动把登录二维码弹出来给你扫 ——
# NapCat 需要登录时会把码写到 <dir>\cache\qrcode.png 就不管了，用户原本得
# 自己去文件管理器里翻。留空 = 不自动弹（仍可自己去找那个文件扫）。
dir = "D:\\App\\NapCat"

# 隐藏控制台窗口启动（v0.5.0 默认 true）。
# 为什么：NapCat 必须提权（往 QQ 进程注入 DLL），但提权之后的那个 cmd 窗口
# **是可以不存在的**。老做法 os.startfile(批处理) 会留下一个永久挂着的黑框
# （脚本末尾的 pause），既占任务栏又没信息量。
#   true  = 经 wscript 隐藏启动；UAC 弹窗仍需点「是」；失败记录在日志中
#   false = 回到老行为（可见控制台 + 完整输出），排障时用
hidden = true

# 界面「协议端日志」要展示的启动记录（含启动前预检结果）。相对项目根。
log_file = "data/logs/napcat.log"

# QQ.exe 路径。留空 = 从注册表 UninstallString 自动推导（推荐）。
# 只有在注册表读不到 QQ 安装记录时才需要手填。
qq_path = ""

# ---- 真实账单数据源（v0.5.0；v0.5.1 增加「余额差值法」）----
# 「今日花费 / 累计花费」原来只按**本地 token 用量**估算，界面值和 DeepSeek
# 平台的账单对不上。现在按下面的优先级取数，并在界面上标明是哪一种口径：
#
#   1. platform      —— 平台明细，最准（还能看到哪个模型花了多少），但要登录态 token
#   2. balance_diff  —— **余额差值法**（v0.5.1 新增，推荐）：
#                       官方余额是实时数字，所以「余额的下降量累加」就是真实消费。
#                       不需要任何额外凭据 —— 余额接口本来每次刷新都要查，
#                       程序顺手把读数存进 balance_readings 表即可。
#                       代价：分辨率只到 ¥0.01（官方余额就两位小数），
#                             且只能给总额，给不了「哪个模型花的」。
#   3. estimate      —— 本地按 token 用量估算，是兜底，通常偏低。
#
# 余额差值法需要**攒读数**：程序刚装上时读数不够两点，会自动回落到估算。
# 每 cache_seconds 记一次，另外午夜后会立刻补记一次（让「今日」的起点贴近 00:00）。
#
# 注意：**余额、消费明细是两套凭证**，不能互换。
#   * 余额      → 用 [llm] 里的 api_key 打官方 GET /user/balance（始终可用）
#   * 消费明细  → 用下面的 platform_token 打平台前端接口（需手动复制一次，会过期）
# platform_token 的取法：浏览器登录 platform.deepseek.com → F12 → Application
# → Local Storage → 找 userToken，把值整段粘到这里（形如 sk-... 之外的一串 JWT）。
# 留空 = 拿不到明细；今日/累计仍会用余额差值法给出真实值，明细那部分才回落到估算。
[billing]
platform_token   = ""
platform_enabled = true
cache_seconds    = 600    # 快照缓存（秒）。界面轮询不会每次都打网络。
start_year       = 0      # 0 = 用库里最早有记录的那一天作为起点
start_month      = 0
timeout_seconds  = 20

[retention]
keep_days_raw   = 90
keep_days_media = 30

# 消息萃取服务配置
# 修改后重启服务生效。

[app]
db_path    = "data/msgx.db"
media_dir  = "data/media"
report_dir = "data/reports"
log_level  = "INFO"

[onebot]
# NapCat 以「反向 WebSocket」方式连入本服务。
# 注意路径必须是 /onebot/ws（ws_port 端口上）；/onebot 是 HTTP POST 上报路径，混淆会握手失败。
# NapCat 侧填：ws://127.0.0.1:6700/onebot/ws
host        = "127.0.0.1"
ws_port     = 6700
http_port   = 6701
access_token = ""          # 与 NapCat 侧 token 保持一致；留空表示不校验

[watch]
# 留空 = 监听机器人账号加入的全部群。填写群号则只处理所列群。
groups = []

# 需要「被点名就强提醒」的 QQ 号。
# 关键：监听用的是独立小号，所以别人 @ 小号几乎不会发生。
# 把你自己的主号 QQ 填进来，群里 @ 你时才会被判为高优先级。
# 例：at_qq = ["12345678"]
at_qq = []

# 群号 → 群名。OneBot 群消息事件不带群名，在这里补上便于阅读。
# 例：123456789 = "AI 底层原理交流"
[watch.names]

[llm]
enabled                 = true
base_url                = "https://api.deepseek.com"
model                   = "deepseek-flash"   # 文本模型
vision_model            = "deepseek-flash"   # 图片模型；实测不支持图片时会自动降级为 OCR-only
api_key_env             = "DEEPSEEK_API_KEY"
api_key                 = ""                 # 也可直接写在这里（不推荐，优先用环境变量）
max_daily_cost_cny      = 10.0
# ---- 计费口径：对齐 DeepSeek 开放平台账单 ----
# 官方对 deepseek-flash（V4.1-Flash）实行「峰谷 + 缓存命中」三档计价，
# 单位：元 / 百万 token，以下填的是**空闲时段**价。
# 来源：https://api-docs.deepseek.com/quick_start/pricing
price_cache_hit_cny_per_mtok  = 0.02   # 输入 · 缓存命中
price_cache_miss_cny_per_mtok = 1.00   # 输入 · 缓存未命中
price_output_cny_per_mtok     = 4.00   # 输出
peak_multiplier               = 2.0    # 高峰 = 空闲 × 2
# 高峰时段（UTC，仅周一至周五）= 北京时间工作日 09:00-12:00 与 14:00-18:00
peak_windows_utc              = "01:00-04:00,06:00-10:00"
timeout_seconds         = 90

# 图片上传前的压缩（v0.5.0）。请求里带的是 detail="low"，服务端本来就会把图
# 大幅降采样（实测一张 2.8MB 的图进来只计 198 个 prompt token），客户端先缩到
# 长边 1280 / JPEG q85 可把上传量降到 1/30，图像内容与提取质量无可感知差异。
vision_max_side         = 1280
vision_jpeg_quality     = 85

[media]
ocr_enabled        = true
vision_enabled     = true     # 需 vision_model 实测支持图片，否则自动关闭
max_download_mb    = 20
images_per_minute  = 60       # 图片处理限速，控制成本

[summary]
interval_minutes    = 30      # 周期摘要间隔
daily_report_at     = "22:00" # 每日报告时间（本地时区）
chunk_char_budget   = 6000    # 单次送模型的最大字符数
min_messages        = 8       # 窗口内消息少于此数则不生成摘要

[score]
# 高精度关键词：命中即进入候选池，再由模型判定
keywords = ["招聘", "内推", "开源", "白嫖", "免费", "踩坑", "漏洞", "论文", "数据集", "复现", "实测", "避雷"]
link_domains = ["github.com", "arxiv.org", "huggingface.co", "paperswithcode.com", "zhihu.com"]
p0_min_score = 8               # 达到该分数才强提醒（先设高，避免误报疲劳）
p1_min_score = 5               # 无模型时的降级阈值
llm_review_min_score = 2       # 规则分达到该值就交给模型复核（决定模型调用量，进而决定成本）
                               # 调高 = 省钱但可能漏掉「没有链接和关键词、但有价值的解答」

[notify]
backend      = "auto"          # auto | winotify | powershell
sound        = true            # 强提醒播放系统提示音
webhook_url  = ""              # 留空 = 仅本机通知；将来要推手机时填入即可
webhook_type = "wecom"         # wecom | serverchan | json

[napcat]
# 协议端（NapCat）的启动脚本。
#
# 本服务只做「监听协议端连入」，**不会**替你启动 NapCat —— 这是两件事。
# 填上下面这行，界面里就会出现「启动协议端(NapCat)」按钮，点一下即可拉起。
#
# 默认指向项目自带的 tools/start_napcat.bat：它会自动探测 NapCat 目录
# （也可用环境变量 NAPCAT_HOME 指定），先修正工作目录再提权 —— 直接调 NapCat 自带的
# launcher.bat 会因为工作目录变成 System32 而一闪而过。
# 相对路径以项目根为基准，所以整个项目搬到别的目录也不用改这里。
#
# 注意：会弹一次 UAC 授权窗口，必须点「是」。原因：NapCat 要向 QQ 进程注入 DLL，
# 这属于管理员操作，无法绕过。（NapCat 启动后 QQ 会一起起来，首次需扫码登录。）
#
# 留空 = 不显示该按钮，仍可手动启动。
start_script = "tools/start_napcat.bat"

# NapCat 的安装目录。填了它，界面才会自动把登录二维码弹出来给你扫 ——
# NapCat 需要登录时会把码写到 <dir>\cache\qrcode.png 就不管了，用户原本得
# 自己去文件管理器里翻。留空 = 不自动弹（仍可自己去找那个文件扫）。
dir = "D:\\App\\NapCat"

# 隐藏控制台窗口启动（v0.5.0 默认 true）。
# 为什么：NapCat 必须提权（往 QQ 进程注入 DLL），但提权之后的那个 cmd 窗口
# **是可以不存在的**。老做法 os.startfile(批处理) 会留下一个永久挂着的黑框
# （脚本末尾的 pause），既占任务栏又没信息量。
#   true  = 经 wscript 隐藏启动；UAC 弹窗仍需点「是」；失败会弹消息框
#   false = 回到老行为（可见控制台 + 完整输出），排障时用
hidden = true

# 界面「协议端日志」要展示的启动记录（含启动前预检结果）。相对项目根。
log_file = "data/logs/napcat.log"

# QQ.exe 路径。留空 = 从注册表 UninstallString 自动推导（推荐）。
# 只有在注册表读不到 QQ 安装记录时才需要手填。
qq_path = ""

# ---- 真实账单数据源（v0.5.0）----
# 「今日花费 / 累计花费」原来只按**本地 token 用量**估算，界面值和 DeepSeek
# 平台的账单对不上。现在改成优先抓平台真实数据；抓不到才回退本地估算，
# 并在界面上标明是哪一种口径。
#
# 注意：**余额和消费是两套凭证**，不能互换。
#   * 余额  → 用 [llm] 里的 api_key 打官方 GET /user/balance（始终可用）
#   * 消费  → 用下面的 platform_token 打平台前端接口（需手动复制一次，会过期）
# platform_token 的取法：浏览器登录 platform.deepseek.com → F12 → Application
# → Local Storage → 找 userToken，把值整段粘到这里（形如 sk-... 之外的一串 JWT）。
# 留空 = 只看本地估算，界面会标注「估算」。
[billing]
platform_token   = ""
platform_enabled = true
cache_seconds    = 600    # 快照缓存（秒）。界面轮询不会每次都打网络。
start_year       = 0      # 0 = 用库里最早有记录的那一天作为起点
start_month      = 0
timeout_seconds  = 20

[retention]
keep_days_raw   = 90
keep_days_media = 30

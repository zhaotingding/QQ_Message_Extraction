<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
  <title>消息萃取</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="status.css">
  <link rel="stylesheet" href="messages.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="title-bar">
    <div class="title-controls" id="title-controls"></div>
    <span class="app-name">消息萃取</span>
    <div class="window-tools" id="window-tools"></div>
  </header>
  <div class="workbench">
    <nav class="activity-bar" id="navigation" aria-label="主导航"></nav>
    <main class="workspace">
      <header class="workspace-header"><h1 id="title">运行状态</h1></header>
      <div id="pages"></div>
    </main>
    <aside class="inspector" id="inspector" aria-labelledby="inspector-title" hidden>
      <header class="inspector-header">
        <h2 id="inspector-title"></h2>
        <div id="inspector-tools"></div>
      </header>
      <div id="inspector-content"></div>
    </aside>
  </div>
  <footer class="status-bar">
    <span id="connection" class="connection" role="status">正在读取状态</span>
    <span class="version" id="version"></span>
  </footer>
  <div id="feedback" role="status" aria-live="polite" hidden></div>
</body>
</html>
